# Decap CMS 配置
# 本地模式：运行 `npm run cms`（decap-server）后访问后台即可可视化编辑，
# 内容写入本地文件系统，推送到 GitHub 仓库后触发线上部署。

backend:
  # 使用本地代理后端（配合 decap-server），须用 git-gateway
  name: git-gateway

# 启用本地代理：Decap 前端会把 /api/v1 请求转发到 decap-server(8081)
local_backend: true

# 媒体文件（图片）上传目录
# media_folder: 图片实际保存位置（相对仓库根目录）
# public_folder: 写入文章字段的相对路径（相对文章所在目录 src/content/blog）
media_folder: "src/assets/uploads"
public_folder: "../../assets/uploads"

collections:
  - name: "blog"
    label: "博客文章"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "摘要", name: "description", widget: "text" }
      - { label: "发布日期", name: "pubDate", widget: "date", date_format: "MMM DD YYYY" }
      - { label: "更新日期", name: "updatedDate", widget: "date", required: false, date_format: "MMM DD YYYY" }
      - { label: "封面图", name: "heroImage", widget: "image", required: false, choose_url: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "resources"
    label: "资源共享"
    folder: "src/content/resources"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "摘要", name: "description", widget: "text" }
      - { label: "分类", name: "category", widget: "select", options: ["开源项目", "开源软件", "大模型", "其他"], default: "其他" }
      - { label: "下载/访问链接", name: "link", widget: "string", hint: "如 GitHub 仓库、官网或下载地址" }
      - { label: "文件大小", name: "size", widget: "string", required: false, hint: "如 7.2 GB（可选）" }
      - { label: "版本", name: "version", widget: "string", required: false, hint: "如 v2.5.0（可选）" }
      - { label: "发布日期", name: "pubDate", widget: "date", date_format: "MMM DD YYYY" }
      - { label: "更新日期", name: "updatedDate", widget: "date", required: false, date_format: "MMM DD YYYY" }
      - { label: "封面图", name: "heroImage", widget: "image", required: false, choose_url: false }
      - { label: "正文", name: "body", widget: "markdown" }
